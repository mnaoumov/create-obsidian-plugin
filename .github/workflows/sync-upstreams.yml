name: Sync Upstreams

# Checks every upstream `upstreams.json` lists and opens or updates one PR per upstream that moved, on the branch
# `upstream/<name>`. The job is typescript-dev-toolkit's reusable workflow, which runs the toolkit's `sync-upstreams`
# bin; see its header for what each PR carries. Nothing is ever merged automatically.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated upstream names to check (all when empty)
        required: false
        default: ''
      dry-run:
        description: Print the PRs instead of pushing them
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: mnaoumov/typescript-dev-toolkit/.github/workflows/sync-upstreams.yml@3.3.0
    with:
      # A verify's `gate:case` fills every unset answer with that question's first value, and the first package
      # manager is bun, so a gate run here needs every manager the generator offers. Pinning the verify to npm was the
      # other fix and was refused: it would stop the gate from ever proving the bun, pnpm and yarn projects. The reusable
      # workflow takes no extra steps, so the managers come from their own npm packages rather than setup actions. npm
      # 11 skips a package's install scripts unless allowed, and bun's postinstall is what fetches its binary. The
      # version probes fail the run here, rather than in a verify, if any of the three is still unusable.
      setup-command: >-
        npm install --global --allow-scripts=bun,pnpm,yarn bun pnpm yarn
        && bun --version && pnpm --version && yarn --version
      only: ${{ inputs.only }}
      dry-run: ${{ inputs.dry-run || false }}
